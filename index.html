<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умная теплица | GitHub Синхронизация</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #2d5a2e; font-size: 24px; }
        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }
        .sensor {
            background: white;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
        }
        .sensor-value { font-size: 36px; font-weight: bold; color: #2d5a2e; }
        .sensor-label { font-size: 12px; color: #666; margin-top: 5px; }
        button {
            background: #2d5a2e;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            margin: 5px;
        }
        .control-btn { background: #4caf50; margin: 5px; }
        .control-btn.off { background: #999; }
        .status {
            background: #2d5a2e;
            color: white;
            padding: 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #2d5a2e;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            animation: slideIn 0.3s;
            z-index: 1000;
        }
        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .settings-panel {
            background: #ff9800;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 15px;
        }
        .settings-panel input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 12px;
            border: none;
        }
        .hidden { display: none; }
        .sync-badge {
            background: #4caf50;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>🌱 Умная теплица <span class="sync-badge">GitHub</span></h1>
        <div>Авто-синхронизация между устройствами</div>
    </div>

    <div id="settingsPanel" class="settings-panel">
        <h3>🔐 Настройки подключения</h3>
        <input type="password" id="tokenInput" placeholder="GitHub Token (только gist)">
        <input type="text" id="gistIdInput" placeholder="ID Gist">
        <button id="saveBtn">💾 Сохранить</button>
        <div style="font-size: 11px; margin-top: 8px;">Токен и ID сохранятся в браузере</div>
    </div>

    <div id="mainUI" class="hidden">
        <div class="sensor-grid">
            <div class="sensor"><div class="sensor-value" id="tempValue">--</div><div class="sensor-label">🌡️ Температура (°C)</div></div>
            <div class="sensor"><div class="sensor-value" id="humValue">--</div><div class="sensor-label">💧 Влажность (%)</div></div>
            <div class="sensor"><div class="sensor-value" id="soilValue">--</div><div class="sensor-label">🌱 Влажность почвы (%)</div></div>
            <div class="sensor"><div class="sensor-value" id="lightValue">--</div><div class="sensor-label">☀️ Освещённость (%)</div></div>
        </div>

        <div class="card">
            <button id="pumpBtn" class="control-btn off">💧 ПОЛИВ</button>
            <button id="lightBtn" class="control-btn off">💡 СВЕТ</button>
            <button id="windowBtn" class="control-btn off">🪟 ФОРТОЧКА</button>
        </div>

        <div class="card">
            <div class="status" id="syncStatus">🟢 Синхронизация активна</div>
            <div style="font-size: 11px; margin-top: 8px;" id="lastSyncTime">Ожидание синхронизации</div>
        </div>
    </div>
</div>

<script>
// ========== ДАННЫЕ ==========
let temp = 22.5, direction = 0.05;
let hum = 58, light = 65, soil = 42;
let devices = { pump: false, light: false, window: false };

// ID устройства
let myDeviceId = localStorage.getItem('device_id');
if (!myDeviceId) {
    myDeviceId = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    localStorage.setItem('device_id', myDeviceId);
}

let ghToken = null;
let gistId = null;
let syncTimer = null;
let lastLoadedData = '';

// ========== UI ФУНКЦИИ ==========
function updateUI() {
    document.getElementById('tempValue').textContent = temp.toFixed(1);
    document.getElementById('humValue').textContent = hum;
    document.getElementById('soilValue').textContent = soil;
    document.getElementById('lightValue').textContent = light;
    
    document.getElementById('pumpBtn').className = `control-btn ${devices.pump ? '' : 'off'}`;
    document.getElementById('lightBtn').className = `control-btn ${devices.light ? '' : 'off'}`;
    document.getElementById('windowBtn').className = `control-btn ${devices.window ? '' : 'off'}`;
}

function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}

// ========== ОТПРАВКА В GITHUB ==========
async function sendToGitHub() {
    if (!ghToken || !gistId) return;
    
    const dataToSend = {
        deviceId: myDeviceId,
        temp: temp,
        hum: hum,
        soil: soil,
        light: light,
        devices: devices,
        timestamp: Date.now()
    };
    
    try {
        const getRes = await fetch(`https://api.github.com/gists/${gistId}`, {
            headers: { 'Authorization': `token ${ghToken}` }
        });
        const gist = await getRes.json();
        
        let allData = {};
        if (gist.files && gist.files['teplitsa.json']) {
            try {
                allData = JSON.parse(gist.files['teplitsa.json'].content);
            } catch(e) { allData = { history: [] }; }
        }
        if (!allData.history) allData.history = [];
        
        allData.history.push(dataToSend);
        if (allData.history.length > 30) allData.history.shift();
        allData.last = dataToSend;
        
        await fetch(`https://api.github.com/gists/${gistId}`, {
            method: 'PATCH',
            headers: {
                'Authorization': `token ${ghToken}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                files: { 'teplitsa.json': { content: JSON.stringify(allData, null, 2) } }
            })
        });
        
        document.getElementById('lastSyncTime').innerHTML = `Отправлено: ${new Date().toLocaleTimeString()}`;
    } catch(e) {
        console.log('Ошибка отправки:', e);
    }
}

// ========== ЗАГРУЗКА ИЗ GITHUB ==========
async function loadFromGitHub() {
    if (!ghToken || !gistId) return;
    
    try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
            headers: { 'Authorization': `token ${ghToken}` }
        });
        const gist = await res.json();
        
        if (gist.files && gist.files['teplitsa.json']) {
            const data = JSON.parse(gist.files['teplitsa.json'].content);
            
            if (data && data.last && data.last.deviceId !== myDeviceId) {
                const dataStr = JSON.stringify(data.last);
                if (lastLoadedData !== dataStr) {
                    lastLoadedData = dataStr;
                    
                    temp = data.last.temp;
                    hum = data.last.hum;
                    soil = data.last.soil;
                    light = data.last.light;
                    devices = data.last.devices;
                    
                    updateUI();
                    document.getElementById('lastSyncTime').innerHTML = `Получено: ${new Date(data.last.timestamp).toLocaleTimeString()}`;
                    document.getElementById('syncStatus').innerHTML = '🟢 Синхронизировано!';
                    showToast('🔄 Данные синхронизированы');
                    
                    setTimeout(() => {
                        document.getElementById('syncStatus').innerHTML = '🟢 Синхронизация активна';
                    }, 2000);
                }
            }
        }
    } catch(e) {
        console.log('Ошибка загрузки:', e);
    }
}

// ========== СОХРАНЕНИЕ НАСТРОЕК ==========
document.getElementById('saveBtn').onclick = () => {
    const token = document.getElementById('tokenInput').value;
    const id = document.getElementById('gistIdInput').value;
    
    if (token && id) {
        localStorage.setItem('github_token', token);
        localStorage.setItem('gist_id', id);
        ghToken = token;
        gistId = id;
        
        document.getElementById('settingsPanel').classList.add('hidden');
        document.getElementById('mainUI').classList.remove('hidden');
        
        // Создаём начальные данные в Gist
        fetch(`https://api.github.com/gists/${gistId}`, {
            method: 'PATCH',
            headers: {
                'Authorization': `token ${ghToken}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                files: {
                    'teplitsa.json': {
                        content: JSON.stringify({ history: [], last: null }, null, 2)
                    }
                }
            })
        });
        
        // Запускаем синхронизацию
        setTimeout(() => loadFromGitHub(), 1000);
        if (syncTimer) clearInterval(syncTimer);
        syncTimer = setInterval(() => {
            sendToGitHub();
            loadFromGitHub();
        }, 4000);
        
        showToast('✅ Настройки сохранены! Синхронизация запущена');
    } else {
        showToast('❌ Введите токен и ID Gist');
    }
};

// ========== ПРОВЕРКА СОХРАНЁННЫХ НАСТРОЕК ==========
const savedToken = localStorage.getItem('github_token');
const savedId = localStorage.getItem('gist_id');

if (savedToken && savedId) {
    ghToken = savedToken;
    gistId = savedId;
    document.getElementById('settingsPanel').classList.add('hidden');
    document.getElementById('mainUI').classList.remove('hidden');
    
    setTimeout(() => loadFromGitHub(), 1000);
    syncTimer = setInterval(() => {
        sendToGitHub();
        loadFromGitHub();
    }, 4000);
}

// ========== УПРАВЛЕНИЕ УСТРОЙСТВАМИ ==========
document.getElementById('pumpBtn').onclick = () => {
    devices.pump = true;
    updateUI();
    showToast('💧 Полив включён');
    sendToGitHub();
    setTimeout(() => {
        devices.pump = false;
        updateUI();
        sendToGitHub();
    }, 3000);
};

document.getElementById('lightBtn').onclick = () => {
    devices.light = !devices.light;
    updateUI();
    showToast(devices.light ? '💡 Свет включён' : '💡 Свет выключен');
    sendToGitHub();
};

document.getElementById('windowBtn').onclick = () => {
    devices.window = !devices.window;
    updateUI();
    showToast(devices.window ? '🪟 Форточка открыта' : '🪟 Форточка закрыта');
    sendToGitHub();
};

// ========== СИМУЛЯЦИЯ ДАННЫХ ==========
setInterval(() => {
    temp += direction;
    if (temp > 28) direction = -0.05;
    if (temp < 22) direction = 0.05;
    hum = 55 + Math.floor(Math.sin(Date.now()/10000) * 10);
    light = 40 + Math.floor(Math.sin(Date.now()/5000) * 30);
    soil = 35 + Math.floor(Math.sin(Date.now()/30000) * 10);
    
    updateUI();
}, 5000);

updateUI();
</script>
</body>
</html>
