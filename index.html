<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умная теплица | Облачная синхронизация</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #2d5a2e; font-size: 24px; }
        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }
        .sensor {
            background: white;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
        }
        .sensor-value {
            font-size: 36px;
            font-weight: bold;
            color: #2d5a2e;
        }
        .sensor-label { font-size: 12px; color: #666; margin-top: 5px; }
        button {
            background: #2d5a2e;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            margin: 5px;
        }
        .control-btn {
            background: #4caf50;
            margin: 5px;
        }
        .control-btn.off { background: #999; }
        .status {
            background: #2d5a2e;
            color: white;
            padding: 10px;
            border-radius: 20px;
            font-size: 12px;
            text-align: center;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #2d5a2e;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            animation: slideIn 0.3s;
        }
        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>🌱 Умная теплица</h1>
        <div style="font-size: 12px; color: #666;">Облачная синхронизация ☁️</div>
    </div>

    <div class="sensor-grid">
        <div class="sensor">
            <div class="sensor-value" id="tempValue">22.5</div>
            <div class="sensor-label">🌡️ Температура (°C)</div>
        </div>
        <div class="sensor">
            <div class="sensor-value" id="humValue">58</div>
            <div class="sensor-label">💧 Влажность (%)</div>
        </div>
        <div class="sensor">
            <div class="sensor-value" id="soilValue">42</div>
            <div class="sensor-label">🌱 Почва (%)</div>
        </div>
        <div class="sensor">
            <div class="sensor-value" id="lightValue">65</div>
            <div class="sensor-label">☀️ Освещение (%)</div>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button id="pumpBtn" class="control-btn off">💧 ПОЛИВ</button>
            <button id="lightBtn" class="control-btn off">💡 СВЕТ</button>
            <button id="windowBtn" class="control-btn off">🪟 ФОРТОЧКА</button>
        </div>
    </div>

    <div class="card">
        <div class="status" id="syncStatus">
            🟢 Синхронизация активна
        </div>
        <div style="font-size: 11px; text-align: center; margin-top: 10px; color: #666;" id="lastSync">
            Последняя синхронизация: --:--:--
        </div>
    </div>
</div>

<script>
// ========== ДАННЫЕ ==========
let temp = 22.5, direction = 0.05;
let hum = 58, light = 65, soil = 42;
let devices = { pump: false, light: false, window: false };

// ========== ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ (ЧЕРЕЗ МОЙ СЕРВЕР) ==========
// Используем бесплатный сервис JSONbin.io для хранения данных

const BIN_ID = '6789a4b3e41b4d34e4f1a2b3'; // Моя тестовая корзина
const API_KEY = '$2a$10$testkey1234567890'; // Публичный ключ

let deviceId = localStorage.getItem('device_id');
if (!deviceId) {
    deviceId = 'd_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
    localStorage.setItem('device_id', deviceId);
}

let isSyncing = false;

function updateUI() {
    document.getElementById('tempValue').textContent = temp.toFixed(1);
    document.getElementById('humValue').textContent = hum;
    document.getElementById('soilValue').textContent = soil;
    document.getElementById('lightValue').textContent = light;
    
    document.getElementById('pumpBtn').className = `control-btn ${devices.pump ? '' : 'off'}`;
    document.getElementById('lightBtn').className = `control-btn ${devices.light ? '' : 'off'}`;
    document.getElementById('windowBtn').className = `control-btn ${devices.window ? '' : 'off'}`;
}

function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
}

// Сохранение в облако через бесплатный сервис
async function saveToCloud() {
    if (isSyncing) return;
    
    try {
        // Сначала получаем текущие данные
        const getRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { 'X-Master-Key': API_KEY }
        });
        const json = await getRes.json();
        let allData = json.record || {};
        
        // Добавляем новую запись
        const newRecord = {
            deviceId: deviceId,
            temp: temp,
            hum: hum,
            soil: soil,
            light: light,
            devices: devices,
            timestamp: Date.now()
        };
        
        if (!allData.history) allData.history = [];
        allData.history.push(newRecord);
        if (allData.history.length > 50) allData.history.shift();
        allData.last = newRecord;
        
        // Сохраняем обратно
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': API_KEY
            },
            body: JSON.stringify(allData)
        });
        
        document.getElementById('lastSync').innerHTML = `Последняя синхронизация: ${new Date().toLocaleTimeString()}`;
    } catch(e) {
        console.log('Ошибка сохранения:', e);
    }
}

// Загрузка из облака
async function loadFromCloud() {
    if (isSyncing) return;
    
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { 'X-Master-Key': API_KEY }
        });
        const json = await res.json();
        const data = json.record;
        
        if (data && data.last && data.last.deviceId !== deviceId) {
            isSyncing = true;
            
            temp = data.last.temp;
            hum = data.last.hum;
            soil = data.last.soil;
            light = data.last.light;
            devices = data.last.devices;
            
            updateUI();
            showToast('🔄 Данные синхронизированы с облака');
            document.getElementById('syncStatus').innerHTML = '🟢 Синхронизировано ☁️';
            
            setTimeout(() => { isSyncing = false; }, 500);
        }
    } catch(e) {
        console.log('Ошибка загрузки:', e);
    }
}

// ========== УПРАВЛЕНИЕ ==========
document.getElementById('pumpBtn').onclick = () => {
    devices.pump = true;
    updateUI();
    showToast('💧 Полив включён');
    saveToCloud();
    setTimeout(() => { devices.pump = false; updateUI(); saveToCloud(); }, 3000);
};

document.getElementById('lightBtn').onclick = () => {
    devices.light = !devices.light;
    updateUI();
    showToast(devices.light ? '💡 Свет включён' : '💡 Свет выключен');
    saveToCloud();
};

document.getElementById('windowBtn').onclick = () => {
    devices.window = !devices.window;
    updateUI();
    showToast(devices.window ? '🪟 Форточка открыта' : '🪟 Форточка закрыта');
    saveToCloud();
};

// ========== АВТООБНОВЛЕНИЕ ДАННЫХ ==========
setInterval(() => {
    temp += direction;
    if (temp > 28) direction = -0.05;
    if (temp < 22) direction = 0.05;
    hum = 55 + Math.floor(Math.sin(Date.now()/10000) * 10);
    light = 40 + Math.floor(Math.sin(Date.now()/5000) * 30);
    soil = 35 + Math.floor(Math.sin(Date.now()/30000) * 10);
    
    updateUI();
    saveToCloud();
}, 4000);

// ========== ЗАПУСК ==========
setInterval(loadFromCloud, 5000);
setTimeout(loadFromCloud, 1000);
updateUI();
showToast('☁️ Облачная синхронизация запущена');
</script>
</body>
</html>
